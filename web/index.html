<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TrialFlow &middot; Clinical Trial Product &amp; Data Operations Platform</title>
<meta name="description" content="A demonstration clinical-trial operations platform: recruitment, site risk, EDC data quality, protocol deviations, adverse events and a simplified CDISC SDTM mapping. Synthetic data only." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230b3d5c'/%3E%3Cpath d='M22 55h14l8-20 10 34 8-14h16' fill='none' stroke='%234db6ac' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.34.0/plotly.min.js" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">TrialFlow</span>
      <span class="brand-tag">Clinical Trial Product &amp; Data Operations</span>
    </div>
    <div class="study-meta" id="study-meta"></div>
  </div>
</header>

<div class="synthetic-banner" role="note">
  Demonstration project. All patients, sites, investigators and the study drug are synthetic. The CDISC SDTM mapping is a simplified demonstration model, not a validated implementation.
</div>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button class="tab" data-view="overview" aria-current="true">Executive Overview</button>
  <button class="tab" data-view="sites">Site Performance</button>
  <button class="tab" data-view="journey">Patient Journey (EDC)</button>
  <button class="tab" data-view="quality">Data Quality</button>
  <button class="tab" data-view="deviations">Protocol Deviations</button>
  <button class="tab" data-view="ae">Adverse Events</button>
  <button class="tab" data-view="sdtm">SDTM Mapping</button>
  <button class="tab" data-view="copilot">Risk Copilot</button>
</nav>

<main id="app">
  <p class="loading" id="loading">Loading trial data&hellip;</p>
</main>

<footer class="footer">
  <span id="footer-meta"></span>
  <span class="footer-links">
    <a href="https://github.com/DEVANSHISHAH59/trialflow" target="_blank" rel="noopener">Source &amp; product docs on GitHub</a>
  </span>
</footer>

<script src="app.js"></script>
</body>
</html>
